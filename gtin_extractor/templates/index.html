<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GTIN Extractor</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
        crossorigin="anonymous">
  <link rel="stylesheet"
        href="https://cdn.datatables.net/1.13.8/css/dataTables.bootstrap5.min.css">
  <style>
    body { background: #f4f6f9; }
    .navbar-brand-bar { background: #1a73e8; }
    #drop-zone {
      border: 2px dashed #1a73e8; border-radius: 8px;
      padding: 2.5rem 1rem; text-align: center; color: #555;
      cursor: pointer; transition: background .2s;
    }
    #drop-zone.over { background: #e8f0fe; }
    #results-card { display: none; }
  </style>
</head>
<body>

<nav class="navbar navbar-brand-bar mb-4">
  <div class="container-fluid">
    <span class="navbar-brand text-white fw-bold fs-5 mb-0">GTIN Extractor</span>
    <span class="text-white-50 small d-none d-sm-inline">
      Batch-extract and validate GTINs from product label images
    </span>
  </div>
</nav>

<div class="container" style="max-width:820px;">

  <!-- Upload card -->
  <div class="card shadow-sm mb-4">
    <div class="card-body">
      <h5 class="card-title text-primary mb-3">Upload Images</h5>

      <div id="drop-zone" class="mb-3" role="button" tabindex="0"
           aria-label="Drop zone: drag and drop images or click to select">
        <div class="fs-2 mb-1">📂</div>
        <p class="mb-1 fw-semibold">Drag &amp; drop images here, or click to select files</p>
        <p class="text-muted small mb-0">.jpg .jpeg .png .bmp .webp .gif</p>
        <input type="file" id="images" multiple
               accept=".jpg,.jpeg,.png,.bmp,.webp,.gif" style="display:none"
               aria-label="Image file input">
      </div>
      <div id="file-list" class="text-muted small mb-3"></div>

      <div class="border rounded p-3 mb-3 bg-light">
        <h6 class="text-primary mb-3">Options</h6>

        <div class="mb-3">
          <label for="gemini_key" class="form-label fw-semibold">
            Google Gemini API Key
            <span class="fw-normal text-muted">(optional)</span>
          </label>
          <input type="password" id="gemini_key" class="form-control"
                 placeholder="AIza…" autocomplete="off">
        </div>

        <div class="mb-3">
          <label for="gemini_model" class="form-label fw-semibold">
            Gemini Model
            <span id="model-status" class="fw-normal text-muted small"></span>
          </label>
          <select id="gemini_model" class="form-select">
            <option value="gemini-2.0-flash" selected>gemini-2.0-flash (default)</option>
            <option value="gemini-1.5-pro">gemini-1.5-pro</option>
            <option value="gemini-1.5-flash">gemini-1.5-flash</option>
          </select>
        </div>

        <div class="form-check">
          <input class="form-check-input" type="checkbox" id="remove_duplicates">
          <label class="form-check-label" for="remove_duplicates">
            Remove duplicate GTINs from results
          </label>
        </div>
      </div>

      <button type="button" id="submit-btn" class="btn btn-primary w-100">
        <span id="btn-text">Extract GTINs</span>
        <span id="btn-spinner" class="spinner-border spinner-border-sm ms-2"
              role="status" aria-hidden="true" style="display:none"></span>
      </button>
    </div>
  </div>

  <!-- Progress card -->
  <div class="card shadow-sm mb-4" id="progress-card" style="display:none">
    <div class="card-body">
      <h5 class="card-title text-primary">
        Processing…
        <span id="progress-count" class="fs-6 fw-normal text-muted ms-2"></span>
      </h5>
      <p id="progress-label" class="text-muted small mb-2">Starting…</p>
      <div class="progress mb-1" style="height:22px">
        <div id="progress-bar"
             class="progress-bar progress-bar-striped progress-bar-animated"
             role="progressbar"
             style="width:0%" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100">
          0%
        </div>
      </div>
    </div>
  </div>

  <!-- Errors / warnings -->
  <div class="alert alert-warning d-none mb-4" id="errors-alert" role="alert">
    <h6 class="alert-heading mb-1">⚠️ Warnings</h6>
    <ul id="errors-list" class="mb-0 small ps-3"></ul>
  </div>

  <!-- Results card -->
  <div class="card shadow-sm mb-4" id="results-card">
    <div class="card-body">
      <h5 class="card-title text-primary mb-3">Results</h5>

      <div class="row g-3 mb-3" id="stats-row"></div>

      <div class="mb-3" id="download-area"></div>

      <div class="table-responsive">
        <table id="results-table" class="table table-striped table-hover table-sm"
               style="width:100%">
          <thead>
            <tr>
              <th>File</th>
              <th>GTIN</th>
              <th>Status</th>
              <th>Method</th>
              <th>Manufacturer</th>
              <th>REF</th>
              <th>Product Name</th>
              <th>Specs</th>
            </tr>
          </thead>
          <tbody id="results-tbody"></tbody>
        </table>
      </div>
    </div>
  </div>

</div><!-- /container -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc4s9bIOgUxi8T/jzmF4tDVCsSz5bfGNRRwAFtuzNe5Y"
        crossorigin="anonymous"></script>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"
        integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
        crossorigin="anonymous"></script>
<script src="https://cdn.datatables.net/1.13.8/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.13.8/js/dataTables.bootstrap5.min.js"></script>

<script>
// ── Drop-zone ────────────────────────────────────────────────────────────────
const dropZone  = document.getElementById('drop-zone');
const fileInput = document.getElementById('images');
const fileList  = document.getElementById('file-list');

dropZone.addEventListener('click',    () => fileInput.click());
dropZone.addEventListener('keydown',  e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fileInput.click(); } });
dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('over'); });
dropZone.addEventListener('dragleave',    () => dropZone.classList.remove('over'));
dropZone.addEventListener('drop', e => {
  e.preventDefault();
  dropZone.classList.remove('over');
  fileInput.files = e.dataTransfer.files;
  showFiles(fileInput.files);
});
fileInput.addEventListener('change', () => showFiles(fileInput.files));

function showFiles(files) {
  if (!files.length) { fileList.textContent = ''; return; }
  fileList.textContent =
    `${files.length} file(s) selected: ` +
    Array.from(files).map(f => f.name).join(', ');
}

// ── Submit / async processing ────────────────────────────────────────────────
let _dataTable = null;

document.getElementById('submit-btn').addEventListener('click', async () => {
  const files = fileInput.files;
  if (!files.length) {
    alert('Please select at least one image file.');
    return;
  }

  // Reset UI state
  document.getElementById('errors-alert').classList.add('d-none');
  document.getElementById('errors-list').innerHTML = '';
  document.getElementById('results-card').style.display = 'none';

  // Build FormData
  const formData = new FormData();
  for (const file of files) formData.append('images', file);
  formData.append('gemini_key',    document.getElementById('gemini_key').value);
  formData.append('gemini_model',  document.getElementById('gemini_model').value);
  if (document.getElementById('remove_duplicates').checked)
    formData.append('remove_duplicates', 'on');

  // Show loading state
  setBusy(true);
  setProgress(0, 'Starting…', 0, files.length);

  // POST to async endpoint
  let taskId;
  try {
    const resp = await fetch('/api/process', { method: 'POST', body: formData });
    if (!resp.ok) throw new Error(`Server error ${resp.status}`);
    ({ task_id: taskId } = await resp.json());
  } catch (err) {
    addError(`Failed to start processing: ${err.message}`);
    setBusy(false);
    return;
  }

  // Poll until complete
  while (true) {
    await delay(1000);
    let data;
    try {
      const resp = await fetch(`/api/progress/${taskId}`);
      data = await resp.json();
    } catch (err) {
      addError(`Polling error: ${err.message}`);
      setBusy(false);
      return;
    }

    const done = (data.rows || []).length;
    setProgress(data.progress, data.current || '', done, data.total);

    if (data.status === 'complete' || data.status === 'error') {
      showResults(data);
      break;
    }
  }

  setBusy(false);
});

function setBusy(busy) {
  const btn     = document.getElementById('submit-btn');
  const spinner = document.getElementById('btn-spinner');
  const txt     = document.getElementById('btn-text');
  btn.disabled           = busy;
  spinner.style.display  = busy ? 'inline-block' : 'none';
  txt.textContent        = busy ? 'Processing…' : 'Extract GTINs';
  document.getElementById('progress-card').style.display = busy ? 'block' : 'none';
}

function setProgress(pct, currentFile, done, total) {
  const bar   = document.getElementById('progress-bar');
  const label = document.getElementById('progress-label');
  const count = document.getElementById('progress-count');
  bar.style.width         = `${pct}%`;
  bar.textContent         = `${pct}%`;
  bar.setAttribute('aria-valuenow', pct);
  label.textContent = currentFile ? `Processing: ${currentFile}` : (pct >= 100 ? 'Done!' : 'Starting…');
  count.textContent = total ? `${done} / ${total} images` : '';
  if (pct >= 100) bar.classList.remove('progress-bar-animated');
  else            bar.classList.add('progress-bar-animated');
}

function showResults(data) {
  const rows   = data.rows   || [];
  const errors = data.errors || [];

  // Warnings
  if (errors.length) {
    document.getElementById('errors-alert').classList.remove('d-none');
    document.getElementById('errors-list').innerHTML =
      errors.map(e => `<li>${escHtml(e)}</li>`).join('');
  }

  // Stats
  const total = rows.length;
  const found = rows.filter(r => r.gtin).length;
  document.getElementById('stats-row').innerHTML = `
    <div class="col-auto">
      <div class="bg-primary bg-opacity-10 rounded p-3 text-center" style="min-width:100px">
        <div class="fs-3 fw-bold text-primary">${total}</div>
        <div class="small text-muted">Images</div>
      </div>
    </div>
    <div class="col-auto">
      <div class="bg-success bg-opacity-10 rounded p-3 text-center" style="min-width:100px">
        <div class="fs-3 fw-bold text-success">${found}</div>
        <div class="small text-muted">GTINs found</div>
      </div>
    </div>
    <div class="col-auto">
      <div class="bg-danger bg-opacity-10 rounded p-3 text-center" style="min-width:100px">
        <div class="fs-3 fw-bold text-danger">${total - found}</div>
        <div class="small text-muted">Not detected</div>
      </div>
    </div>`;

  // Download button (form POST with serialised rows)
  const dlArea = document.getElementById('download-area');
  if (rows.length) {
    dlArea.innerHTML = `
      <form method="POST" action="/download" id="dl-form">
        <input type="hidden" name="rows_json" id="dl-rows-json">
        <button type="submit" class="btn btn-success btn-sm">⬇ Download CSV</button>
      </form>`;
    document.getElementById('dl-rows-json').value = JSON.stringify(rows);
  } else {
    dlArea.innerHTML = '';
  }

  // Table rows
  const tbody = document.getElementById('results-tbody');
  tbody.innerHTML = rows.map(r => `
    <tr>
      <td>${escHtml(r.filename  || '')}</td>
      <td><code>${escHtml(r.gtin || '—')}</code></td>
      <td>${r.gtin
            ? '<span class="badge bg-success">validated</span>'
            : '<span class="badge bg-danger">not found</span>'}</td>
      <td>${r.gtin_detection_method
            ? `<span class="badge bg-primary">${escHtml(r.gtin_detection_method)}</span>`
            : '—'}</td>
      <td>${escHtml(r.manufacturer  || '—')}</td>
      <td>${escHtml(r.ref           || '—')}</td>
      <td>${escHtml(r.product_name  || '—')}</td>
      <td>${escHtml(r.product_specs || '—')}</td>
    </tr>`).join('');

  // (Re-)initialise DataTable
  if (_dataTable) { _dataTable.destroy(); _dataTable = null; }
  if (rows.length) {
    _dataTable = $('#results-table').DataTable({
      pageLength: 25,
      order: [],
      language: { emptyTable: 'No results.' },
    });
  }

  // Show results card and scroll to it
  const card = document.getElementById('results-card');
  card.style.display = 'block';
  card.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function addError(msg) {
  document.getElementById('errors-alert').classList.remove('d-none');
  document.getElementById('errors-list').innerHTML +=
    `<li class="text-danger">${escHtml(msg)}</li>`;
}

function escHtml(str) {
  return String(str)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#039;');
}

function delay(ms) { return new Promise(r => setTimeout(r, ms)); }

// ── Dynamic Gemini model list ────────────────────────────────────────────────
const geminiKeyInput    = document.getElementById('gemini_key');
const geminiModelSelect = document.getElementById('gemini_model');
const modelStatus       = document.getElementById('model-status');
let _modelTimer = null;

function populateModels(models) {
  const current = geminiModelSelect.value;
  geminiModelSelect.innerHTML = '';
  models.forEach((name, i) => {
    const opt = document.createElement('option');
    opt.value       = name;
    opt.textContent = i === 0 ? `${name} (default)` : name;
    if (name === current || (i === 0 && !models.includes(current))) opt.selected = true;
    geminiModelSelect.appendChild(opt);
  });
}

async function fetchModels(key) {
  if (!key) {
    populateModels(['gemini-2.0-flash', 'gemini-1.5-pro', 'gemini-1.5-flash']);
    modelStatus.textContent = '';
    return;
  }
  geminiModelSelect.disabled = true;
  modelStatus.textContent    = '⏳ loading…';
  try {
    const resp = await fetch('/api/models', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ key }),
    });
    const data = await resp.json();
    populateModels(data.models);
    modelStatus.textContent = data.error
      ? '⚠ using defaults' : `(${data.models.length} available)`;
    if (data.error) modelStatus.title = data.error;
  } catch (e) {
    modelStatus.textContent = '⚠ could not load';
    modelStatus.title = String(e);
  } finally {
    geminiModelSelect.disabled = false;
  }
}

geminiKeyInput.addEventListener('input', () => {
  clearTimeout(_modelTimer);
  _modelTimer = setTimeout(() => fetchModels(geminiKeyInput.value.trim()), 600);
});
geminiKeyInput.addEventListener('blur', () => {
  clearTimeout(_modelTimer);
  fetchModels(geminiKeyInput.value.trim());
});
</script>
</body>
</html>
