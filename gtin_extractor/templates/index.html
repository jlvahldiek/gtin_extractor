<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GTIN Extractor</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, sans-serif; background: #f4f6f9; color: #333; }
    header { background: #1a73e8; color: #fff; padding: 1rem 2rem; }
    header h1 { font-size: 1.5rem; font-weight: 600; }
    header p  { font-size: 0.9rem; opacity: .85; margin-top: .2rem; }
    main { max-width: 760px; margin: 2rem auto; padding: 0 1rem; }
    .card { background: #fff; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,.12); padding: 1.5rem; margin-bottom: 1.5rem; }
    .card h2 { font-size: 1.1rem; margin-bottom: 1rem; color: #1a73e8; }
    label { display: block; font-size: .9rem; font-weight: 500; margin-bottom: .3rem; }
    input[type="text"], input[type="password"], select {
      width: 100%; padding: .5rem .75rem; border: 1px solid #ccc;
      border-radius: 5px; font-size: .9rem; margin-bottom: 1rem;
    }
    input[type="file"] { font-size: .9rem; margin-bottom: 1rem; }
    .checkbox-row { display: flex; align-items: center; gap: .5rem; margin-bottom: 1rem; }
    .checkbox-row input { width: auto; }
    .checkbox-row label { margin: 0; font-weight: normal; }
    button[type="submit"] {
      background: #1a73e8; color: #fff; border: none; padding: .65rem 1.5rem;
      border-radius: 5px; font-size: 1rem; cursor: pointer; width: 100%;
    }
    button[type="submit"]:hover { background: #1558b0; }
    .hint { font-size: .8rem; color: #666; margin-top: -.7rem; margin-bottom: 1rem; }
    #drop-zone {
      border: 2px dashed #1a73e8; border-radius: 8px; padding: 2rem 1rem;
      text-align: center; color: #555; margin-bottom: 1rem; cursor: pointer;
      transition: background .2s;
    }
    #drop-zone.over { background: #e8f0fe; }
    #drop-zone p { pointer-events: none; }
    #file-list { font-size: .85rem; color: #444; margin-bottom: 1rem; }
    #loading { display: none; text-align: center; padding: 1rem; color: #1a73e8; }
  </style>
</head>
<body>
<header>
  <h1>GTIN Extractor</h1>
  <p>Batch-extract and validate GTINs from product label images</p>
</header>
<main>
  <div class="card">
    <h2>Upload Images</h2>
    <form id="upload-form" method="POST" action="/process" enctype="multipart/form-data">

      <div id="drop-zone">
        <p>📂 Drag &amp; drop images here, or click to select files</p>
        <input type="file" id="images" name="images" multiple
               accept=".jpg,.jpeg,.png,.bmp,.webp,.gif" style="display:none">
      </div>
      <div id="file-list"></div>

      <div class="card" style="box-shadow:none; border:1px solid #e0e0e0; padding:1rem;">
        <h2 style="margin-bottom:.75rem;">Options</h2>

        <label for="ai_provider">AI Provider</label>
        <select id="ai_provider" name="ai_provider">
          <option value="gemini" selected>Google Gemini</option>
          <option value="openai">OpenAI</option>
        </select>

        <div id="gemini-fields">
          <label for="gemini_key">Google Gemini API Key <span style="font-weight:normal;color:#666;">(optional)</span></label>
          <input type="password" id="gemini_key" name="gemini_key"
                 placeholder="AIza…" autocomplete="off">

          <label for="gemini_model">Gemini Model <span id="gemini-model-status" style="font-weight:normal;color:#666;"></span></label>
          <select id="gemini_model" name="gemini_model">
            <option value="gemini-2.0-flash" selected>gemini-2.0-flash (default)</option>
            <option value="gemini-1.5-pro">gemini-1.5-pro</option>
            <option value="gemini-1.5-flash">gemini-1.5-flash</option>
          </select>
        </div>

        <div id="openai-fields" style="display:none;">
          <label for="openai_key">OpenAI API Key <span style="font-weight:normal;color:#666;">(optional)</span></label>
          <input type="password" id="openai_key" name="openai_key"
                 placeholder="sk-..." autocomplete="off">

          <label for="openai_model">OpenAI Model <span id="openai-model-status" style="font-weight:normal;color:#666;"></span></label>
          <select id="openai_model" name="openai_model">
            <option value="gpt-4.1-mini" selected>gpt-4.1-mini (default)</option>
            <option value="gpt-4.1">gpt-4.1</option>
            <option value="gpt-4o-mini">gpt-4o-mini</option>
          </select>
        </div>

        <div class="checkbox-row">
          <input type="checkbox" id="remove_duplicates" name="remove_duplicates">
          <label for="remove_duplicates">Remove duplicate GTINs from results</label>
        </div>
      </div>

      <div id="loading">⏳ Processing images, please wait…</div>
      <button type="submit">Extract GTINs</button>
    </form>
  </div>
</main>

<script>
  const dropZone = document.getElementById('drop-zone');
  const fileInput = document.getElementById('images');
  const fileList  = document.getElementById('file-list');
  const form      = document.getElementById('upload-form');
  const loading   = document.getElementById('loading');

  dropZone.addEventListener('click', () => fileInput.click());
  dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('over'); });
  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('over'));
  dropZone.addEventListener('drop', e => {
    e.preventDefault();
    dropZone.classList.remove('over');
    fileInput.files = e.dataTransfer.files;
    showFiles(fileInput.files);
  });
  fileInput.addEventListener('change', () => showFiles(fileInput.files));

  function showFiles(files) {
    if (!files.length) { fileList.textContent = ''; return; }
    fileList.textContent = `${files.length} file(s) selected: ` +
      Array.from(files).map(f => f.name).join(', ');
  }

  form.addEventListener('submit', () => {
    loading.style.display = 'block';
  });

  // ── Dynamic model list per provider ──────────────────────────────────────
  const aiProviderSelect = document.getElementById('ai_provider');
  const geminiFields = document.getElementById('gemini-fields');
  const openaiFields = document.getElementById('openai-fields');

  const geminiKeyInput = document.getElementById('gemini_key');
  const geminiModelSelect = document.getElementById('gemini_model');
  const geminiModelStatus = document.getElementById('gemini-model-status');

  const openaiKeyInput = document.getElementById('openai_key');
  const openaiModelSelect = document.getElementById('openai_model');
  const openaiModelStatus = document.getElementById('openai-model-status');

  let _modelFetchTimer = null;

  function populateModels(selectEl, models) {
    const current = selectEl.value;
    selectEl.innerHTML = '';
    models.forEach((name, i) => {
      const opt = document.createElement('option');
      opt.value = name;
      opt.textContent = i === 0 ? name + ' (default)' : name;
      if (name === current || (i === 0 && !models.includes(current))) {
        opt.selected = true;
      }
      selectEl.appendChild(opt);
    });
  }

  function updateProviderFields() {
    const provider = aiProviderSelect.value;
    geminiFields.style.display = provider === 'gemini' ? 'block' : 'none';
    openaiFields.style.display = provider === 'openai' ? 'block' : 'none';
  }

  async function fetchModels(provider, key, selectEl, statusEl, fallbackModels) {
    if (!key) {
      populateModels(selectEl, fallbackModels);
      statusEl.textContent = '';
      statusEl.title = '';
      return;
    }

    selectEl.disabled = true;
    statusEl.textContent = '⏳ loading…';

    try {
      const resp = await fetch('/api/models', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ provider, key }),
      });
      const data = await resp.json();
      populateModels(selectEl, data.models);
      if (data.error) {
        statusEl.textContent = '⚠ using defaults';
        statusEl.title = data.error;
      } else {
        statusEl.textContent = `(${data.models.length} available)`;
        statusEl.title = '';
      }
    } catch (e) {
      statusEl.textContent = '⚠ could not load';
      statusEl.title = String(e);
    } finally {
      selectEl.disabled = false;
    }
  }

  function scheduleModelFetch(provider) {
    clearTimeout(_modelFetchTimer);
    if (provider === 'openai') {
      _modelFetchTimer = setTimeout(() => {
        fetchModels(
          'openai',
          openaiKeyInput.value.trim(),
          openaiModelSelect,
          openaiModelStatus,
          ['gpt-4.1-mini', 'gpt-4.1', 'gpt-4o-mini']
        );
      }, 600);
    } else {
      _modelFetchTimer = setTimeout(() => {
        fetchModels(
          'gemini',
          geminiKeyInput.value.trim(),
          geminiModelSelect,
          geminiModelStatus,
          ['gemini-2.0-flash', 'gemini-1.5-pro', 'gemini-1.5-flash']
        );
      }, 600);
    }
  }

  aiProviderSelect.addEventListener('change', () => {
    updateProviderFields();
    scheduleModelFetch(aiProviderSelect.value);
  });

  geminiKeyInput.addEventListener('input', () => scheduleModelFetch('gemini'));
  geminiKeyInput.addEventListener('blur', () => {
    clearTimeout(_modelFetchTimer);
    fetchModels(
      'gemini',
      geminiKeyInput.value.trim(),
      geminiModelSelect,
      geminiModelStatus,
      ['gemini-2.0-flash', 'gemini-1.5-pro', 'gemini-1.5-flash']
    );
  });

  openaiKeyInput.addEventListener('input', () => scheduleModelFetch('openai'));
  openaiKeyInput.addEventListener('blur', () => {
    clearTimeout(_modelFetchTimer);
    fetchModels(
      'openai',
      openaiKeyInput.value.trim(),
      openaiModelSelect,
      openaiModelStatus,
      ['gpt-4.1-mini', 'gpt-4.1', 'gpt-4o-mini']
    );
  });

  updateProviderFields();
</script>
</body>
</html>
