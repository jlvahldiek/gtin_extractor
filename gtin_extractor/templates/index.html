<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GTIN Extractor</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, sans-serif; background: #f4f6f9; color: #333; }
    header { background: #1a73e8; color: #fff; padding: 1rem 2rem; }
    header h1 { font-size: 1.5rem; font-weight: 600; }
    header p  { font-size: 0.9rem; opacity: .85; margin-top: .2rem; }
    main { max-width: 760px; margin: 2rem auto; padding: 0 1rem; }
    .card { background: #fff; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,.12); padding: 1.5rem; margin-bottom: 1.5rem; }
    .card h2 { font-size: 1.1rem; margin-bottom: 1rem; color: #1a73e8; }
    label { display: block; font-size: .9rem; font-weight: 500; margin-bottom: .3rem; }
    input[type="text"], input[type="password"], select {
      width: 100%; padding: .5rem .75rem; border: 1px solid #ccc;
      border-radius: 5px; font-size: .9rem; margin-bottom: 1rem;
    }
    input[type="file"] { font-size: .9rem; margin-bottom: 1rem; }
    .checkbox-row { display: flex; align-items: center; gap: .5rem; margin-bottom: 1rem; }
    .checkbox-row input { width: auto; }
    .checkbox-row label { margin: 0; font-weight: normal; }
    button[type="submit"] {
      background: #1a73e8; color: #fff; border: none; padding: .65rem 1.5rem;
      border-radius: 5px; font-size: 1rem; cursor: pointer; width: 100%;
    }
    button[type="submit"]:hover { background: #1558b0; }
    .hint { font-size: .8rem; color: #666; margin-top: -.7rem; margin-bottom: 1rem; }
    #drop-zone {
      border: 2px dashed #1a73e8; border-radius: 8px; padding: 2rem 1rem;
      text-align: center; color: #555; margin-bottom: 1rem; cursor: pointer;
      transition: background .2s;
    }
    #drop-zone.over { background: #e8f0fe; }
    #drop-zone p { pointer-events: none; }
    #file-list { font-size: .85rem; color: #444; margin-bottom: 1rem; }
    #loading { display: none; text-align: center; padding: 1rem; color: #1a73e8; }
  </style>
</head>
<body>
<header>
  <h1>GTIN Extractor</h1>
  <p>Batch-extract and validate GTINs from product label images</p>
</header>
<main>
  <div class="card">
    <h2>Upload Images</h2>
    <form id="upload-form" method="POST" action="/process" enctype="multipart/form-data">

      <div id="drop-zone">
        <p>📂 Drag &amp; drop images here, or click to select files</p>
        <input type="file" id="images" name="images" multiple
               accept=".jpg,.jpeg,.png,.bmp,.webp,.gif" style="display:none">
      </div>
      <div id="file-list"></div>

      <div class="card" style="box-shadow:none; border:1px solid #e0e0e0; padding:1rem;">
        <h2 style="margin-bottom:.75rem;">Options</h2>

        <label for="gemini_key">Google Gemini API Key <span style="font-weight:normal;color:#666;">(optional)</span></label>
        <input type="password" id="gemini_key" name="gemini_key"
               placeholder="AIza…" autocomplete="off">

        <label for="gemini_model">Gemini Model</label>
        <select id="gemini_model" name="gemini_model">
          <option value="gemini-2.0-flash" selected>gemini-2.0-flash (default)</option>
          <option value="gemini-1.5-pro">gemini-1.5-pro</option>
          <option value="gemini-1.5-flash">gemini-1.5-flash</option>
        </select>

        <div class="checkbox-row">
          <input type="checkbox" id="remove_duplicates" name="remove_duplicates">
          <label for="remove_duplicates">Remove duplicate GTINs from results</label>
        </div>
      </div>

      <div id="loading">⏳ Processing images, please wait…</div>
      <button type="submit">Extract GTINs</button>
    </form>
  </div>
</main>

<script>
  const dropZone = document.getElementById('drop-zone');
  const fileInput = document.getElementById('images');
  const fileList  = document.getElementById('file-list');
  const form      = document.getElementById('upload-form');
  const loading   = document.getElementById('loading');

  dropZone.addEventListener('click', () => fileInput.click());
  dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('over'); });
  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('over'));
  dropZone.addEventListener('drop', e => {
    e.preventDefault();
    dropZone.classList.remove('over');
    fileInput.files = e.dataTransfer.files;
    showFiles(fileInput.files);
  });
  fileInput.addEventListener('change', () => showFiles(fileInput.files));

  function showFiles(files) {
    if (!files.length) { fileList.textContent = ''; return; }
    fileList.textContent = `${files.length} file(s) selected: ` +
      Array.from(files).map(f => f.name).join(', ');
  }

  form.addEventListener('submit', () => {
    loading.style.display = 'block';
  });
</script>
</body>
</html>
